name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # bot (GITHUB_TOKEN) 的 commit 不触发 CI; 每周定时跑一次, 写死日期之类的测试腐烂
  # 和依赖漂移 (requirements 全是 >=) 一周内就能暴露, 不必等下一次人工 push
  schedule:
    - cron: '0 6 * * 1'   # 每周一 UTC 06:00
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff

      - name: Lint (ruff, non-blocking)
        run: |
          ruff check src tests scripts --output-format=github || true

      # 跑整个 tests/ (pytest.ini testpaths), 不再手维护文件白名单 (曾漏掉
      # test_watchdog / test_llm_budget 两个文件); 真联网的测试标 @pytest.mark.network
      - name: Run pytest (offline tests only)
        env:
          CRYPTO_INTEL_USE_BERT: "0"   # 加速 + 避免下载 BERT 模型
        run: |
          python -m pytest -m "not network" -v --tb=short -p no:cacheprovider

      - name: Smoke test (OSS 集成)
        env:
          CRYPTO_INTEL_USE_BERT: "0"
        run: |
          python scripts/smoke_oss_integrations.py

  build-artifact:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate config + db init
        run: |
          pip install -r requirements.txt -q
          python -m src.cli init
          python -m src.cli oss-check
