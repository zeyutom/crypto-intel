name: Realtime Watchdog

# 盘中实时风险预警: 每 2 小时跑一次 watchdog check, 触发即推飞书。
# 不 commit 任何东西 (watchdog_state 走 actions/cache 持久化, 无 git 竞态)。
on:
  schedule:
    - cron: '23 */2 * * *'   # 每 2 小时, 错开整点
  workflow_dispatch:

permissions:
  contents: read
  actions: read   # 失败告警去重: 查上一次 run 的结果

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # 可选出口代理 (同 refresh/nightly): 解锁美区被封的源
      EGRESS_PROXY_URL: ${{ secrets.EGRESS_PROXY_URL }}
      # 飞书 (触发告警时推送)
      FEISHU_GROUP_1_URL: ${{ secrets.FEISHU_GROUP_1_URL }}
      FEISHU_GROUP_1_SECRET: ${{ secrets.FEISHU_GROUP_1_SECRET }}
      FEISHU_GROUP_1_NAME: ${{ secrets.FEISHU_GROUP_1_NAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 跨 run 持久化告警去重状态 (否则持续脱锚等会每 2h 重复告警)
      - name: Restore watchdog dedup state
        uses: actions/cache/restore@v4
        with:
          path: data/watchdog_state.json
          key: watchdog-state-${{ github.run_id }}
          restore-keys: |
            watchdog-state-

      - name: Run watchdog check (push to Feishu on trigger)
        run: |
          if [ -n "$EGRESS_PROXY_URL" ]; then
            export HTTPS_PROXY="$EGRESS_PROXY_URL" HTTP_PROXY="$EGRESS_PROXY_URL" ALL_PROXY="$EGRESS_PROXY_URL"
            echo "▶ 出口代理已启用"
          fi
          python -m src.cli watchdog check

      - name: Save watchdog dedup state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/watchdog_state.json
          key: watchdog-state-${{ github.run_id }}

      # 以前 watchdog 失败只有 GitHub 邮件。连续失败只在第一次告警 (每天跑 4~12 次, 否则刷屏)。
      - name: Alert on job failure or cancel
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          PREV=$(gh run list -R "$GITHUB_REPOSITORY" --workflow watchdog.yml --limit 10 \
                   --json databaseId,status,conclusion \
                   --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID and .status == \"completed\")][0].conclusion" || true)
          case "$PREV" in
            failure|cancelled|timed_out) echo "上一次 watchdog 也是 $PREV, 已告警过, 这次跳过"; exit 0 ;;
          esac
          python3 scripts/sentinel.py alert "🚨 Crypto Intel watchdog workflow 失败/超时/被取消" \
            "盘中风险预警这一轮没跑完 (连续失败只提醒这一次)" \
            "$RUN_URL" || echo "飞书告警发送失败"
