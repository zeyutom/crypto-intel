name: Nightly Auto-Run

# 每天 UTC 16:17 = 北京 00:17 (避开整点排队高峰)。
# GitHub 定时任务实际启动常晚 2-6h (观测值): 原来的 19:00 UTC 在 40 次里有 2 次拖过 UTC 午夜,
# 按 UTC 日期命名的产物 (日志/failures.json/快照缺口/当天调权守卫) 随之错位。提前到 16:17 留足余量。
on:
  schedule:
    - cron: '17 16 * * *'
  workflow_dispatch:  # 也允许手动触发

permissions:
  contents: write   # 让它能 commit 回 data/

jobs:
  nightly:
    runs-on: ubuntu-latest
    # job 超时 50min; screen 单步超时 30min (SCREEN_TIMEOUT), 留 ≥15min 给调权/推送/告警/提交。
    # 曾经 job 30min 而 SCREEN_TIMEOUT 默认 2h: 慢一点的 screen 会让整个 job 被取消, 什么都不提交也不告警。
    timeout-minutes: 50

    env:
      CRYPTO_INTEL_USE_BERT: "0"    # 加速, 不下载 120MB 模型
      SCREEN_TIMEOUT: "1800"        # 必须 < timeout-minutes, 内层超时 (rc=124) 才能先于 job 取消触发
      # 注: data/llm_ledger.json 不入库, 云端账本每次 run 从零开始 = 只统计本次 run 的用量
      MAX_TOKENS_PER_DAY: "200000"
      # 单一权重写入方: 只有云端 nightly 改写 factor_config.json 的权重, 本地 launchd 只读
      # (曾经两边各自调权, 同日 Top-20 只重合 9/20)
      CRYPTO_INTEL_WEIGHT_WRITER: "1"
      # 飞书 webhook 通过 GitHub Secrets 注入
      FEISHU_GROUP_1_URL: ${{ secrets.FEISHU_GROUP_1_URL }}
      FEISHU_GROUP_1_SECRET: ${{ secrets.FEISHU_GROUP_1_SECRET }}
      FEISHU_GROUP_1_NAME: ${{ secrets.FEISHU_GROUP_1_NAME }}
      # AI 简报 LLM key (任一即可, 自动选, 免费源优先): 不想付费就只配 GEMINI 或 GROQ
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}        # 免费 (Google AI Studio)
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}            # 免费 (Groq)
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}  # 付费 (可不配)

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run nightly pipeline
        env:
          # 可选出口代理 (同 refresh.yml): 解锁美区被封的数据源 (binance/farside…)
          EGRESS_PROXY_URL: ${{ secrets.EGRESS_PROXY_URL }}
        run: |
          if [ -n "$EGRESS_PROXY_URL" ]; then
            export HTTPS_PROXY="$EGRESS_PROXY_URL" HTTP_PROXY="$EGRESS_PROXY_URL" ALL_PROXY="$EGRESS_PROXY_URL"
            echo "▶ 出口代理已启用"
          fi
          bash scripts/nightly_run.sh
        continue-on-error: true   # 单步失败不阻塞整个 workflow

      - name: Show today's log tail
        if: always()
        run: |
          TODAY=$(date +%Y-%m-%d)
          if [ -f "data/nightly_logs/$TODAY.log" ]; then
            echo "::group::Nightly log $TODAY (last 200 lines)"
            tail -200 "data/nightly_logs/$TODAY.log"
            echo "::endgroup::"
          fi
          if [ -f "data/nightly_logs/$TODAY.failures.json" ]; then
            echo "::group::Failures"
            cat "data/nightly_logs/$TODAY.failures.json"
            echo "::endgroup::"
          fi

      - name: Commit data updates (with rebase retry on race)
        # always(): pipeline 步骤失败/超时也把已产出的快照/权重/日志推回去
        if: always() && github.ref == 'refs/heads/main'
        run: |
          git config --local user.email "nightly-bot@cryptointel"
          git config --local user.name "Crypto Intel Nightly"

          # 要回推的产物: 不止快照 — 元学习在 runner 上学到的权重 (factor_config.json)、训练日志、
          # 收益追踪、因子报告都要回推, 否则云端每晚学完就丢, 权重永远冻结在仓库里的旧版本。
          # 逐个 add: git add 遇到一个不匹配的 pathspec 会整条命令 fatal, 什么都不加。
          add_outputs() {
            shopt -s nullglob
            local files=(
              data/meta/snapshot_*.json
              data/meta/factor_config.json
              data/meta/training_log.json
              data/meta/returns_*_7d.json
              data/meta/factor_report*.json
              data/meta/ai_brief_latest.json
              data/nightly_logs/20*.log
              data/nightly_logs/*.failures.json
            )
            shopt -u nullglob
            local f
            for f in "${files[@]}"; do
              [ -e "$f" ] && git add -- "$f" || true
            done
          }

          add_outputs
          if git diff --cached --quiet; then
            echo "no data changes"
            exit 0
          fi
          git commit -m "🌙 nightly $(date +%Y-%m-%d) — auto-run results"
          # 记住本次产物 commit: 冲突回退时从这里恢复 data/meta + data/nightly_logs
          NIGHTLY_SHA=$(git rev-parse HEAD)
          # 丢掉 nightly 不发布的 runner 本地改动 (ingest 改了 intel.db, 报告目录; 这两样归 refresh.yml)。
          # 否则 pull --rebase 因 "unstaged changes" 直接失败, 任何一次推送被拒都会掉进下面的回退分支。
          # (分开 checkout: 一条命令里任一 pathspec 不匹配会整条失败, 什么都没恢复)
          git checkout -- data/intel.db 2>/dev/null || true
          git checkout -- data/reports 2>/dev/null || true

          # 最多重试 3 次: push 前先 pull --rebase, 防止与 refresh.yml / 本地 push 撞车
          for i in 1 2 3; do
            echo "▶ Push attempt $i..."
            if git push origin main; then
              echo "✔ push OK"
              exit 0
            fi
            echo "  push rejected, pulling latest..."
            git fetch origin main
            # --rebase: 把 nightly commit 放到远程最新之上
            # --strategy-option=theirs: rebase 里 theirs = 正在重放的 nightly commit, 冲突时以本次产物为准
            if ! git pull --rebase --strategy-option=theirs origin main; then
              echo "  rebase 冲突, 回退到远程重新应用产物"
              git rebase --abort || true
              git reset --hard origin/main
              # reset --hard 会删掉本次新增的快照/日志并回退 factor_config.json: 先从产物 commit 恢复,
              # 否则 add_outputs 永远是 "无差异", 当天产物被静默丢弃
              git checkout "$NIGHTLY_SHA" -- data/meta data/nightly_logs
              add_outputs
              if git diff --cached --quiet; then
                echo "  远程已有相同产物, 无需再推"
                exit 0
              fi
              git commit -m "🌙 nightly $(date +%Y-%m-%d) — auto-run results (retry)"
            fi
            sleep 3
          done

          echo "❌ 3 次 push 都失败, 放弃"
          exit 1
        # 不再 continue-on-error: push 失败要让 job 变红, 触发下面的飞书告警 + GitHub 失败邮件

      - name: Upload nightly logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-logs-${{ github.run_number }}
          path: data/nightly_logs/
          retention-days: 14

      # job 失败/超时/被取消: nightly_run.sh 自己的失败告警跑不到 (脚本被杀) → 在这里补一条
      - name: Alert on job failure or cancel
        if: failure() || cancelled()
        run: |
          python -c "
          import sys; sys.path.insert(0, '.')
          from src.notifier import push_alert
          r = push_alert('🚨 Crypto Intel nightly workflow 失败/超时/被取消', [
              '**run ${{ github.run_id }}** (#${{ github.run_number }}) 没有正常完成',
              '可能: job 超时 / 被取消 / 产物 git push 失败 / 依赖安装失败',
              '今天的快照、权重、日志可能没提交到仓库',
              '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}',
          ])
          print('alert:', r.get('ok'), r.get('error') or ('pushed %s' % r.get('pushed')))
          " || echo "飞书告警发送失败"
